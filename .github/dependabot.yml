version: 2
updates:
  # New base image digests (security patches land here first)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Python dependencies in requirements.txt
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly

  # Pinned GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
